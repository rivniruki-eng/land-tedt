<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 text-center">
    <div class="w-16 h-16 bg-red-600/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold border border-red-500/30">
      18+
    </div>
    
    <h1 class="text-2xl font-bold mb-2">Private Content Access</h1>
    <p class="text-slate-400 text-sm mb-6">You must verify your age and confirm notifications to unlock local matches in your area.</p>

    <div class="space-y-3">
      <button onclick="handleAction()" class="w-full py-4 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 font-bold rounded-xl text-lg shadow-lg shadow-red-600/30 transition transform active:scale-95">
        I AM 18 OR OLDER
      </button>
      <button onclick="handleAction()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 font-semibold rounded-xl text-slate-300 text-sm transition">
        I am under 18
      </button>
    </div>

    <p class="text-xs text-slate-500 mt-6">By clicking enter, you agree to enable system push updates.</p>
  </div>

  <script>
    // Config Smartlink URL
    const SMARTLINK_BASE = "https://YOUR_KEITARO_DOMAIN.com/click.php?key=YOUR_SMARTLINK_KEY";

    // OneSignal Init
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "YOUR_ONESIGNAL_APP_ID",
      });
    });

    // Helper: get & pass URL params
    function getSmartlinkUrl() {
      const currentParams = window.location.search;
      return currentParams ? `${SMARTLINK_BASE}&${currentParams.substring(1)}` : SMARTLINK_BASE;
    }

    // Action Trigger
    async function handleAction() {
      try {
        if (window.OneSignal) {
          await OneSignal.Notifications.requestPermission();
        }
      } catch (e) {
        console.log("Push prompt skipped/blocked");
      } finally {
        window.location.href = getSmartlinkUrl();
      }
    }
  </script>
</body>
</html>
